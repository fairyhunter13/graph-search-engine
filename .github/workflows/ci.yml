# The pre-push hook checks the plan pair and the bundle. It never runs the
# suite or the linter, so a push that skipped the hook was ungated until here.
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # `none` here is deliberate and is not a skip. It is the clean-clone declaration,
  # and every hygiene case that needs no list still runs — including the one
  # asserting that an *unset* list fails rather than stands down.
  #
  # The literal-name sweep does not belong in a repository secret. The test reports
  # its matches, and its matches are the banned names themselves, into a log that is
  # public on this repo. And CI runs after the push, by which time the content is
  # already published. That gate's only useful home is `.githooks/pre-push`.
  GRAPHRAG_NAME_BAN: none

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # The corpus arm runs in `measure`. The engine arm needs both daemons
      # live over this tree, and a runner has neither.
      - run: uv run pytest -o addopts= -q -m "not corpus and not engines"

  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      # The tag is the measurement. A moving standard library moves the number,
      # and then no other machine reproduces it.
      - name: Fetch the pinned corpus
        run: |
          git clone --depth 1 --branch v3.12.7 \
            https://github.com/python/cpython.git \
            "$HOME/.cache/graphrag/corpus/cpython-v3.12.7"
      - run: uv run pytest -o addopts= -q -m "corpus and not engines"
      - name: The receipt the run produced
        run: cat "$HOME/.cache/graphrag/receipts/"*.json

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # setup-go sets GOTOOLCHAIN=local, so the toolchain never upgrades
          # itself. okf v0.6.0 declares `go 1.26.4` and an older Go refuses it.
          go-version: "1.26.4"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Install the checker, pinned
        run: |
          go install github.com/fairyhunter13/okf/cmd/okfrules@v0.6.0
          go install github.com/fairyhunter13/okf/cmd/okf@v0.6.0
      - run: okfrules -strict check -Werror knowledge
